name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.nix"
      - "**/*.lock"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.nix"
      - "**/*.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify Swift build
        run: |
          echo 'let buildVersion = "dev"' > Sources/vz-runner/version.swift
          swift build -c release

      # Unit tests need no VM: the Swift tests cover the protocol, snapshot
      # and forwarder logic; the guest-agent tests run its handlers against
      # a fake containerd. VM-based suites stay on the self-hosted runner.
      - name: Swift tests
        run: swift test

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: guest-agent/go.mod
          cache-dependency-path: guest-agent/go.sum

      - name: go.mod is tidy
        working-directory: guest-agent
        run: go mod tidy -diff

      - name: gofmt
        working-directory: guest-agent
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: go vet (linux/arm64, the real target)
        working-directory: guest-agent
        run: GOOS=linux GOARCH=arm64 go vet ./...

      - name: go test -race
        working-directory: guest-agent
        run: go test -race ./...

      - name: staticcheck (linux/arm64)
        working-directory: guest-agent
        # Installed for the host, then pointed at the linux/arm64 build.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          GOOS=linux GOARCH=arm64 "$(go env GOPATH)/bin/staticcheck" ./...

  build:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          echo "let buildVersion = \"${version}\"" > Sources/vz-runner/version.swift
          swift build -c release

      - name: Codesign
        run: >
          codesign --entitlements entitlements.plist
          --force -s -
          --identifier com.olegshirko.vz-runner
          .build/release/vz-runner

      - name: Prepare artifacts
        run: |
          mkdir -p _output
          cp .build/release/vz-runner _output/vz-runner-darwin-arm64
          shasum -a 256 _output/vz-runner-darwin-arm64 > _output/vz-runner-darwin-arm64.sha256sum
          tar czf _output/anvil-darwin-arm64.tar.gz -C _output vz-runner-darwin-arm64
          shasum -a 256 _output/anvil-darwin-arm64.tar.gz > _output/anvil-darwin-arm64.tar.gz.sha256sum

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifact-macos-arm64
          path: _output/
          retention-days: 1

  guestbuild:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: guest-agent/go.mod
          cache-dependency-path: guest-agent/go.sum

      # The build container must run linux/arm64 so that binaries pulled from
      # Alpine packages match the VM's ARM64 architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Makefile owns every download URL and version (kernel apk,
      # containerd, runc, CNI, buildkit, Alpine packages); CI used to carry a
      # copy that a version bump could silently skip. upx comes from apk in
      # the build container below, so download-upx is not needed here.
      - name: Download assets and build guest-agent
        run: make download-alpine extract-alpine-kernel guest-agent container-tools alpine-iptables

      - name: Build initramfs-containerd
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/.download:/build/download" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/guest-agent:/guest-agent:ro" \
            -e IN_CONTAINER=1 \
            -e OUT=/build/download/ubuntu/initramfs-containerd \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            alpine:3.20 \
            sh -c 'apk add --no-cache bash cpio zstd binutils upx && exec bash /scripts/build_initramfs_containerd.sh'

      - name: Verify initramfs architecture
        run: |
          sudo apt-get install -y cpio file zstd >/dev/null 2>&1 || true
          mkdir -p /tmp/initrd-check
          cd /tmp/initrd-check
          zstd -dc "$GITHUB_WORKSPACE/.download/ubuntu/initramfs-containerd" | cpio -idmv 2>/dev/null || true
          ls -l bin/tar sbin/mkfs.ext4
          file bin/tar
          file sbin/mkfs.ext4
          file -b bin/tar | grep -qiE 'aarch64|arm64' || { echo "ERROR: bin/tar is not ARM64"; exit 1; }

      - name: Upload kernel + initramfs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifact-linux-arm64
          path: |
            .download/alpine/vmlinuz-raw
            .download/ubuntu/initramfs-containerd
          retention-days: 1

  validate:
    # GitHub-hosted macos runners have no hypervisor ("Virtualization is not
    # available on this hardware"), so VM-booting robustness checks only run
    # on a self-hosted Apple Silicon runner, triggered manually.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    needs: guestbuild
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact-linux-arm64
          path: .download/
      - name: Build and sign vz-runner
        run: |
          echo 'let buildVersion = "dev"' > Sources/vz-runner/version.swift
          swift build -c release
          codesign --entitlements entitlements.plist --force -s - --identifier com.olegshirko.vz-runner .build/release/vz-runner
      - name: Robustness checks (save/resume, kill -9, FD leaks, CNI, isolation)
        run: |
          python3 scripts/validate_robustness.py || {
            echo "=== /tmp/validate_robustness.log ==="
            tail -60 /tmp/validate_robustness.log 2>/dev/null
            echo "=== daemon.log ==="
            tail -40 ~/.anvil-vz/daemon.log 2>/dev/null
            echo "=== console.log ==="
            tail -20 ~/.anvil-vz/console.log 2>/dev/null
            exit 1
          }

      - name: Docker API integration tests (docker CLI + compose against the daemon)
        run: |
          .build/release/vz-runner start
          python3 scripts/integration_tests.py || {
            .build/release/vz-runner stop || true
            echo "=== daemon.log ==="
            tail -40 ~/.anvil-vz/daemon.log 2>/dev/null
            exit 1
          }
          .build/release/vz-runner stop

  release:
    needs: [build, guestbuild]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact-macos-arm64
          path: _output/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact-linux-arm64
          path: _output/
      - name: bundle tar.gz
        run: |
          cd _output
          chmod +x vz-runner-darwin-arm64
          cp ../scripts/anvil-service.sh .
          cp ../scripts/com.olegshirko.anvil.plist .
          # upload-artifact strips the common .download/ ancestor; flatten.
          cp alpine/vmlinuz-raw .
          cp ubuntu/initramfs-containerd .
          # Ship the kernel gzipped (~10 MB instead of ~34 MB raw);
          # anvil-service.sh unpacks it once on first start.
          gzip -9 -n -c vmlinuz-raw > vmlinuz-raw.gz
          # GZIP=-n makes the tarball deterministic so the Homebrew sha256 matches.
          GZIP=-n tar czf anvil-darwin-arm64.tar.gz \
            vz-runner-darwin-arm64 \
            vmlinuz-raw.gz initramfs-containerd \
            anvil-service.sh com.olegshirko.anvil.plist
          shasum -a 256 anvil-darwin-arm64.tar.gz | awk '{print $1}' > anvil-darwin-arm64.tar.gz.sha256sum
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF##*/}"
          # The annotated tag message carries the release notes generated by
          # `make release` (scripts/gen_release_notes.sh); fall back to the
          # auto-generated ones when it is empty.
          notes=$(git for-each-ref "refs/tags/${tag}" --format='%(contents)')
          set -- --title "${tag}"
          if [ -n "${notes// /}" ]; then set -- "$@" --notes "${notes}"; else set -- "$@" --generate-notes; fi
          gh release create "${tag}" "$@" \
            _output/vz-runner-darwin-arm64 \
            _output/vz-runner-darwin-arm64.sha256sum \
            _output/anvil-darwin-arm64.tar.gz \
            _output/anvil-darwin-arm64.tar.gz.sha256sum
