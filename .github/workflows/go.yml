name: Release

on:
  push:
    tags: ["v*"]
    branches: [test]
    paths-ignore:
      - "**/*.md"
      - "**/*.nix"
      - "**/*.lock"
  pull_request:
    branches: [test]
    paths-ignore:
      - "**/*.md"
      - "**/*.nix"
      - "**/*.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify Swift build
        run: swift build -c release

  build:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build
        run: swift build -c release

      - name: Codesign
        run: >
          codesign --entitlements entitlements.plist
          --force -s -
          --identifier com.olegshirko.vz-runner
          .build/release/vz-runner

      - name: Prepare artifacts
        run: |
          mkdir -p _output
          cp .build/release/vz-runner _output/vz-runner-darwin-arm64
          shasum -a 256 _output/vz-runner-darwin-arm64 > _output/vz-runner-darwin-arm64.sha256sum
          tar czf _output/anvil-darwin-arm64.tar.gz -C _output vz-runner-darwin-arm64
          shasum -a 256 _output/anvil-darwin-arm64.tar.gz > _output/anvil-darwin-arm64.tar.gz.sha256sum

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifact-macos-arm64
          path: _output/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact-macos-arm64
          path: _output/
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF##*/}"
          gh release create "${tag}" --title "${tag}" --generate-notes \
            _output/vz-runner-darwin-arm64 \
            _output/vz-runner-darwin-arm64.sha256sum \
            _output/anvil-darwin-arm64.tar.gz \
            _output/anvil-darwin-arm64.tar.gz.sha256sum
