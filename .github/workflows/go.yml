name: Release

on:
  push:
    tags: ["v*"]
    branches: [test]
    paths-ignore:
      - "**/*.md"
      - "**/*.nix"
      - "**/*.lock"
  pull_request:
    branches: [test]
    paths-ignore:
      - "**/*.md"
      - "**/*.nix"
      - "**/*.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify Swift build
        run: |
          echo 'let buildVersion = "dev"' > Sources/vz-runner/version.swift
          swift build -c release

  build:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          echo "let buildVersion = \"${version}\"" > Sources/vz-runner/version.swift
          swift build -c release

      - name: Codesign
        run: >
          codesign --entitlements entitlements.plist
          --force -s -
          --identifier com.olegshirko.vz-runner
          .build/release/vz-runner

      - name: Prepare artifacts
        run: |
          mkdir -p _output
          cp .build/release/vz-runner _output/vz-runner-darwin-arm64
          shasum -a 256 _output/vz-runner-darwin-arm64 > _output/vz-runner-darwin-arm64.sha256sum
          tar czf _output/anvil-darwin-arm64.tar.gz -C _output vz-runner-darwin-arm64
          shasum -a 256 _output/anvil-darwin-arm64.tar.gz > _output/anvil-darwin-arm64.tar.gz.sha256sum

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifact-macos-arm64
          path: _output/
          retention-days: 1

  guestbuild:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: false

      # The build container must run linux/arm64 so that binaries pulled from
      # Alpine packages match the VM's ARM64 architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Alpine initramfs (base userspace)
        run: |
          mkdir -p .download/alpine
          curl -L -o .download/alpine/initramfs-virt https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/netboot/initramfs-virt

      - name: Download Alpine linux-virt package (kernel + modules)
        run: |
          mkdir -p .download/alpine/linux-virt-pkg
          curl -L -o .download/alpine/linux-virt.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/linux-virt-6.6.142-r0.apk
          tar -xzf .download/alpine/linux-virt.apk -C .download/alpine/linux-virt-pkg boot lib/modules

      - name: Extract raw kernel
        run: |
          python3 scripts/extract_alpine_kernel.py .download/alpine/linux-virt-pkg/boot/vmlinuz-virt .download/alpine/vmlinuz-raw.gz
          gunzip -c .download/alpine/vmlinuz-raw.gz > .download/alpine/vmlinuz-raw || test -s .download/alpine/vmlinuz-raw
          file .download/alpine/vmlinuz-raw

      - name: Build guest-agent
        run: |
          cd guest-agent
          go mod tidy
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../.download/alpine/guest-agent .

      - name: Download container tools
        run: |
          mkdir -p .download/container-tools
          curl -L -o .download/container-tools/containerd.tgz https://github.com/containerd/containerd/releases/download/v2.3.3/containerd-static-2.3.3-linux-arm64.tar.gz
          curl -L -o .download/container-tools/nerdctl.tgz https://github.com/containerd/nerdctl/releases/download/v2.3.5/nerdctl-2.3.5-linux-arm64.tar.gz
          curl -L -o .download/container-tools/runc https://github.com/opencontainers/runc/releases/download/v1.5.1/runc.arm64
          chmod +x .download/container-tools/runc
          curl -L -o .download/container-tools/cni-plugins.tgz https://github.com/containernetworking/plugins/releases/download/v1.9.1/cni-plugins-linux-arm64-v1.9.1.tgz
          curl -L -o .download/container-tools/buildkit.tgz https://github.com/moby/buildkit/releases/download/v0.32.2/buildkit-v0.32.2.linux-arm64.tar.gz

      - name: Download Alpine iptables
        run: |
          mkdir -p .download/alpine-iptables
          curl -L -o .download/alpine-iptables/iptables.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/iptables-1.8.10-r3.apk
          curl -L -o .download/alpine-iptables/libmnl.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libmnl-1.0.5-r2.apk
          curl -L -o .download/alpine-iptables/libnftnl.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libnftnl-1.2.6-r0.apk
          curl -L -o .download/alpine-iptables/libxtables.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libxtables-1.8.10-r3.apk
          curl -L -o .download/alpine-iptables/tar.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/tar-1.35-r2.apk
          curl -L -o .download/alpine-iptables/libacl.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libacl-2.3.2-r0.apk
          curl -L -o .download/alpine-iptables/libattr.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libattr-2.5.2-r0.apk
          curl -L -o .download/alpine-iptables/e2fsprogs.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/e2fsprogs-1.47.0-r5.apk
          curl -L -o .download/alpine-iptables/e2fsprogs-extra.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/e2fsprogs-extra-1.47.0-r5.apk
          curl -L -o .download/alpine-iptables/e2fsprogs-libs.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/e2fsprogs-libs-1.47.0-r5.apk
          curl -L -o .download/alpine-iptables/libcom_err.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libcom_err-1.47.0-r5.apk
          curl -L -o .download/alpine-iptables/libblkid.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libblkid-2.40.1-r1.apk
          curl -L -o .download/alpine-iptables/libuuid.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libuuid-2.40.1-r1.apk

      - name: Build initramfs-containerd
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/.download:/build/download" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/guest-agent:/guest-agent:ro" \
            -e IN_CONTAINER=1 \
            -e OUT=/build/download/ubuntu/initramfs-containerd \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            alpine:3.20 \
            sh -c 'apk add --no-cache bash cpio zstd binutils upx && exec bash /scripts/build_initramfs_containerd.sh'

      - name: Verify initramfs architecture
        run: |
          sudo apt-get install -y cpio file zstd >/dev/null 2>&1 || true
          mkdir -p /tmp/initrd-check
          cd /tmp/initrd-check
          zstd -dc "$GITHUB_WORKSPACE/.download/ubuntu/initramfs-containerd" | cpio -idmv 2>/dev/null || true
          ls -l bin/tar sbin/mkfs.ext4
          file bin/tar
          file sbin/mkfs.ext4
          file -b bin/tar | grep -qiE 'aarch64|arm64' || { echo "ERROR: bin/tar is not ARM64"; exit 1; }

      - name: Upload kernel + initramfs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifact-linux-arm64
          path: |
            .download/alpine/vmlinuz-raw
            .download/ubuntu/initramfs-containerd
          retention-days: 1

  validate:
    # GitHub-hosted macos runners have no hypervisor ("Virtualization is not
    # available on this hardware"), so VM-booting robustness checks only run
    # on a self-hosted Apple Silicon runner, triggered manually.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    needs: guestbuild
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact-linux-arm64
          path: .download/
      - name: Build and sign vz-runner
        run: |
          echo 'let buildVersion = "dev"' > Sources/vz-runner/version.swift
          swift build -c release
          codesign --entitlements entitlements.plist --force -s - --identifier com.olegshirko.vz-runner .build/release/vz-runner
      - name: Robustness checks (save/resume, kill -9, FD leaks, CNI, isolation)
        run: |
          python3 scripts/validate_robustness.py || {
            echo "=== /tmp/validate_robustness.log ==="
            tail -60 /tmp/validate_robustness.log 2>/dev/null
            echo "=== daemon.log ==="
            tail -40 ~/.anvil-vz/daemon.log 2>/dev/null
            echo "=== console.log ==="
            tail -20 ~/.anvil-vz/console.log 2>/dev/null
            exit 1
          }

  release:
    needs: [build, guestbuild]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact-macos-arm64
          path: _output/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact-linux-arm64
          path: _output/
      - name: bundle tar.gz
        run: |
          cd _output
          chmod +x vz-runner-darwin-arm64
          cp ../scripts/anvil-service.sh .
          cp ../scripts/com.olegshirko.anvil.plist .
          # upload-artifact strips the common .download/ ancestor; flatten.
          cp alpine/vmlinuz-raw .
          cp ubuntu/initramfs-containerd .
          # Ship the kernel gzipped (~10 MB instead of ~34 MB raw);
          # anvil-service.sh unpacks it once on first start.
          gzip -9 -n -c vmlinuz-raw > vmlinuz-raw.gz
          # GZIP=-n makes the tarball deterministic so the Homebrew sha256 matches.
          GZIP=-n tar czf anvil-darwin-arm64.tar.gz \
            vz-runner-darwin-arm64 \
            vmlinuz-raw.gz initramfs-containerd \
            anvil-service.sh com.olegshirko.anvil.plist
          shasum -a 256 anvil-darwin-arm64.tar.gz | awk '{print $1}' > anvil-darwin-arm64.tar.gz.sha256sum
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF##*/}"
          gh release create "${tag}" --title "${tag}" --generate-notes \
            _output/vz-runner-darwin-arm64 \
            _output/vz-runner-darwin-arm64.sha256sum \
            _output/anvil-darwin-arm64.tar.gz \
            _output/anvil-darwin-arm64.tar.gz.sha256sum
